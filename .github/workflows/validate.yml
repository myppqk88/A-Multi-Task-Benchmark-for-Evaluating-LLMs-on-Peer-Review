name: Validate candidate benchmark
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tracked data and candidate status
        run: python scripts/validate_repository.py
      - name: Check scoring software using synthetic fixtures only
        run: python evaluation/verify_scoring_tools.py
